<head>
  <link href="http://gmpg.org/xfn/11" rel="profile">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="content-type" content="text/html; charset=utf-8">

  <!-- Enable responsiveness on mobile devices-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

  <title>
    {% if page.title == "Home" %}
      {{ site.title }} &middot; {{ site.tagline }}
    {% else %}
      {{ page.title }} &middot; {{ site.title }}
    {% endif %}
  </title>

  <!-- CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}/styles/poole.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/styles/syntax.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/styles/lanyon.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=PT+Serif:400,400italic,700%7CPT+Sans:400">
  <link rel="stylesheet" href="{{ site.baseurl }}/styles/style.css">
{% if page.title == "CV" %}
<link rel="stylesheet" href="{{ site.baseurl }}/styles/print.css">
{% endif %}

{% if site.tags != "" %}
  {% include collecttags.html %}
{% endif %}
  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="RSS" href="/atom.xml">
<script src="https://kit.fontawesome.com/6b159de666.js" crossorigin="anonymous"></script>

</head>
